<svg width="1080" height="720" viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1080" height="720" rx="14" fill="#0f172a"/>

  <!-- Title -->
  <text x="540" y="22" text-anchor="middle" font-size="17" font-weight="bold" fill="#fbbf24">VELICHAM THARAAM — Workflow</text>

  <!-- Residents -->
  <rect x="40"  y="40" width="300" height="70" rx="12" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
  <text x="190" y="68"  text-anchor="middle" font-size="16" font-weight="bold"   fill="#fbbf24">Resident A</text>
  <text x="190" y="94"  text-anchor="middle" font-size="14" fill="#e5e7eb">taps 🔴 CURRENT POYI</text>

  <rect x="390" y="40" width="300" height="70" rx="12" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
  <text x="540" y="68"  text-anchor="middle" font-size="16" font-weight="bold"   fill="#fbbf24">Resident B</text>
  <text x="540" y="94"  text-anchor="middle" font-size="14" fill="#e5e7eb">taps 🔴 CURRENT POYI</text>

  <rect x="740" y="40" width="300" height="70" rx="12" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
  <text x="890" y="68"  text-anchor="middle" font-size="16" font-weight="bold"   fill="#fbbf24">Resident C</text>
  <text x="890" y="94"  text-anchor="middle" font-size="14" fill="#e5e7eb">taps 🔴 CURRENT POYI</text>

  <!-- Arrows to Firebase -->
  <line x1="190" y1="110" x2="460" y2="178" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="110" x2="540" y2="178" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="890" y1="110" x2="620" y2="178" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Firebase -->
  <rect x="400" y="180" width="280" height="68" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
  <text x="540" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#93c5fd">Realtime Database / Firestore</text>
  <text x="540" y="230" text-anchor="middle" font-size="13" fill="#cbd5e1">⚡ reports + timestamps</text>

  <!-- Arrow to consensus -->
  <line x1="540" y1="248" x2="540" y2="296" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Consensus diamond -->
  <polygon points="540,300 720,364 540,428 360,364" fill="#374151" stroke="#facc15" stroke-width="2"/>
  <text x="540" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#fde68a">≥ 3 distinct reports</text>
  <text x="540" y="382" text-anchor="middle" font-size="14" fill="#fde68a">within 5-min window?</text>

  <!-- No path -->
  <line x1="720" y1="364" x2="782" y2="364" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="752" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#f87171">No</text>
  <rect x="790" y="330" width="260" height="68" rx="12" fill="#1f2937" stroke="#f87171" stroke-width="2"/>
  <text x="920" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#fca5a5">⚠️ Consensus pending</text>
  <text x="920" y="378" text-anchor="middle" font-size="13" fill="#e5e7eb">invite more neighbours</text>

  <!-- Yes path -->
  <line x1="540" y1="428" x2="540" y2="478" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="556" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#4ade80">Yes</text>

  <!-- Verified -->
  <rect x="400" y="480" width="280" height="68" rx="12" fill="#065f46" stroke="#34d399" stroke-width="2"/>
  <text x="540" y="506" text-anchor="middle" font-size="15" font-weight="bold" fill="#6ee7b7">✅ Outage VERIFIED</text>
  <text x="540" y="530" text-anchor="middle" font-size="13" fill="#d1fae5">consensus reached</text>

  <!-- Arrow verified -> torch -->
  <line x1="540" y1="548" x2="540" y2="608" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Torch -->
  <rect x="330" y="610" width="420" height="82" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
  <text x="540" y="638" text-anchor="middle" font-size="15" font-weight="bold" fill="#fcd34d">💥 Torch: Blink × 3 (400ms)</text>
  <text x="540" y="664" text-anchor="middle" font-size="14" fill="#fde68a">→ Solid ON · all phones flash in sync</text>

  <!-- Arrow verified -> controller -->
  <line x1="680" y1="514" x2="852" y2="514" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Controller -->
  <rect x="860" y="480" width="190" height="68" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="955" y="506" text-anchor="middle" font-size="15" font-weight="bold" fill="#7dd3fc">⚡ Controller</text>
  <text x="955" y="530" text-anchor="middle" font-size="13" fill="#bae6fd">🟢 CURRENT VANNU</text>

  <!-- Arrow controller -> restore -->
  <line x1="955" y1="548" x2="955" y2="608" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Restore -->
  <rect x="830" y="610" width="250" height="82" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="955" y="638" text-anchor="middle" font-size="15" font-weight="bold" fill="#7dd3fc">🔆 Power restored</text>
  <text x="955" y="664" text-anchor="middle" font-size="14" fill="#bae6fd">→ all flashlights turn OFF</text>
</svg>